name: Company Gap Filler
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 0 * * *"
jobs:
  x7q:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: z9k
        env:
          GAP_FILLER_STOP_AFTER_OLD_ROWS: "30"
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GAP_FILLER_MAX_RUN_MINUTES: "120"
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          GAP_FILLER_MAX_DAYS_BACK: "10"
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GAP_FILLER_MAX_SECONDS_PER_COMPANY: "120"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GAP_FILLER_MAX_ROWS_PER_RUN: "600"
          GAP_FILLER_MAX_SCRAPERAPI_PAGES: "200"
        run: python -u gap_filler.py
